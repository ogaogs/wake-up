openapi: 3.1.0
info:
  title: <feature name> API
  version: 0.1.0
  description: |
    API contract for the <feature name> feature.
    This file is the source of truth — implementation and basic-design defer to it.

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local

# NOTE: Use this template ONLY for features that cross a network boundary
# (a backend API, or a third-party HTTP service like Slack). For a local iOS
# feature — the default in this app — use assets/interface-contract.md instead,
# which documents the public Swift surface.

# ---- Reusable components ----
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g., NOT_FOUND, INVALID_INPUT)
        message:
          type: string
          description: Human-readable explanation
        details:
          type: object
          additionalProperties: true

    # Replace these with your real domain types.
    Foo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid auth
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

# ---- Endpoints ----
paths:
  /foos:
    get:
      summary: List foos
      operationId: listFoos
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Foo'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a foo
      operationId: createFoo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /foos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a foo by id
      operationId: getFoo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
